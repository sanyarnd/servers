---
dialout_users: [alex, ansible]
docker_services_users: [alex, ansible]
mounts_users: [alex, ansible]
mounts_owner_user: ansible

# --------------------------------------
# Local Services (drives both Envoy + DNS)
# --------------------------------------
lab_domain: "home"
lab_ip: "192.168.88.88"

technitium_api_url: "http://192.168.88.88"
technitium_api_port: 5380
technitium_api_token: "{{ vault_technitium_api_token }}"

# Required attributes for each entry in apps:
#   name:        short identifier (used in DNS, Envoy, URLs)
#   port:        listen port on the host
#   group:       homepage section name
#   label:       human-readable display name
#   icon:        dashboard icon identifier
#   description: short description shown on the dashboard
#   homepage:    boolean — whether to show on the homepage
#   widget:      dict of widget config (type is required inside), or false to disable

apps:
  - name: hass
    port: 8123
    group: Smart Home
    label: Home Assistant
    icon: home-assistant
    description: Home automation & IoT
    homepage: true
    widget:
      type: homeassistant
      key: "{{ vault_home_assistant_api_token }}"
      custom:
        - template: "{{ '{{' }} states.switch|selectattr('state','equalto','on')|list|length {{ '}}' }}"
          label: switches on

  - name: z2m
    port: 8124
    group: Smart Home
    label: Zigbee2MQTT
    icon: zigbee2mqtt
    description: Zigbee device management
    homepage: true
    widget: false

  - name: jellyfin
    port: 8096
    group: Media
    label: Jellyfin
    icon: jellyfin
    description: Movies, TV & Music
    homepage: true
    widget:
      type: jellyfin
      key: "{{ vault_jellyfin_api_key }}"
      version: 2
      enableBlocks: true
      enableNowPlaying: true
      enableUser: true
      enableMediaControl: false
      showEpisodeNumber: false
      expandOneStreamToTwoRows: true

  - name: serr
    port: 5055
    group: Media
    label: Serr
    icon: jellyseerr
    description: Movies, TV & Music
    homepage: true
    widget:
      type: jellyseerr
      key: "{{ vault_serr_api_key }}"

  - name: qbt
    port: 8111
    group: Media
    label: qBittorrent
    icon: qbittorrent
    description: Torrent downloads
    homepage: true
    widget:
      type: qbittorrent
      username: "{{ vault_qbt_username }}"
      password: "{{ vault_qbt_password }}"
      enableLeechProgress: true
      enableLeechSize: true

  - name: stash
    port: 9999
    group: Media
    label: Stash
    icon: stash
    description: Media organizer
    homepage: true
    widget:
      type: stash
      key: "{{ vault_stash_api_key }}"
      fields: ["scenes", "sceneSize", "images", "imageSize"]

  - name: immich
    port: 2283
    group: Documents & Photos
    label: Immich
    icon: immich
    description: Photo & video backup
    homepage: true
    widget:
      type: immich
      key: "{{ vault_immich_api_key }}"
      version: 2

  - name: paperless
    port: 8000
    group: Documents & Photos
    label: Paperless-ngx
    icon: paperless-ngx
    description: Document management
    homepage: true
    widget:
      type: paperlessngx
      key: "{{ vault_paperless_ngx_api_key }}"

  - name: pairdrop
    port: 4000
    group: Documents & Photos
    label: PairDrop
    icon: pairdrop
    description: Local file sharing
    homepage: true
    widget: false

  - name: dockhand
    port: 3000
    group: Tools
    label: Dockhand
    icon: docker
    description: Docker container management
    homepage: true
    widget:
      type: dockhand

  - name: scrutiny
    port: 8130
    group: Tools
    label: Scrutiny
    icon: scrutiny
    description: Disk S.M.A.R.T. monitoring
    homepage: true
    widget:
      type: scrutiny

  - name: dns
    port: 5380
    group: Tools
    label: Technitium DNS
    icon: technitium-dns
    description: DNS server & ad blocking
    homepage: true
    widget:
      type: technitium
      key: "{{ vault_technitium_api_token }}"
      range: LastDay

  - name: start
    port: 5000
    group: Tools
    label: Homepage
    icon: homepage
    description: This dashboard
    homepage: true
    widget: false

# --------------------------------------
# Homepage layout settings per group
# --------------------------------------
homepage_group_settings:
  Smart Home:
    icon_style: row
    columns: 3
  Media:
    icon_style: row
    columns: 3
  Documents & Photos:
    icon_style: row
    columns: 3
  Tools:
    icon_style: row
    columns: 3

# --------------------------------------
# Disks
# --------------------------------------
mounts_boot:
  - device: "/dev/disk/by-id/dm-uuid-LVM-BH8GE9gsgEvvg6oAOiwnwkpYqOv2cUdb4u7oMq6LKueF14N9cRpe0i9j81BnO2SZ"
    mount_point: "/"
    type: "ext4"
    options: defaults
    dump: 0
    pass: 1
  - device: "/dev/disk/by-uuid/975e2593-0db5-46e6-a2d1-fc2527a18a1f"
    mount_point: "/boot"
    type: "ext4"
    options: "defaults"
    dump: 0
    pass: 1
  - device: "/dev/disk/by-uuid/0874-E9F6"
    mount_point: "/boot/efi"
    type: "vfat"
    options: "defaults"
    dump: 0
    pass: 1
  - device: "/swap.img"
    mount_point: "none"
    type: "swap"
    options: "sw"
    dump: 0
    pass: 0

mounts_normal:
  - uuid: "94f3b831-0159-47d8-822e-86fd1b5f7008"
    mount_point: "/mnt/hdd1"
    type: "ext4"
    options: "defaults,nofail"
    dump: 0
    pass: 2
    comment: "8TB Seagate Enterprise 2019"

  - uuid: "68cd5296-dd92-4524-9c60-ffb43974d334"
    mount_point: "/mnt/hdd2"
    type: "ext4"
    options: "defaults,nofail"
    dump: 0
    pass: 2
    comment: "8TB Seagate Exos 2022"

  - uuid: "39414da2-9eb8-4cb7-88c0-5108355f3e48"
    mount_point: "/mnt/hdd3"
    type: "ext4"
    options: "defaults,nofail"
    dump: 0
    pass: 2
    comment: "16TB TOSHIBA MG08ACA1 2025"

  - uuid: "673cd3c3-1aa8-4e82-a13d-5da5f7c986ec"
    mount_point: "/mnt/hdd4"
    type: "ext4"
    options: "defaults,nofail"
    dump: 0
    pass: 2
    comment: "16TB TOSHIBA MG08ACA1 2025"

mounts_pooled:
  - name: "media"
    mount_point: "/mnt/media"
    dump: 0
    pass: 0
    # process-thread-count=-2: Enables a separate thread pool for processing FUSE requests.
    #   Value -2 means: number of CPU cores divided by 2 (minimum 1 thread).
    #   -1 disables separate processing threads; 0 uses core count; positive values set a fixed number.
    # read-thread-count=-2: Number of threads dedicated to reading FUSE messages from the kernel.
    #   -2 means: number of CPU cores divided by 2.
    #   Works together with process-thread-count to separate reading and processing stages.
    # lazy-umount-mountpoint=true: mergerfs will attempt to "lazy unmount" the mount point before mounting.
    #   Useful for live upgrades or avoiding mount conflicts.
    # category.create=pfrd: Policy for new file placement — selects the first branch with above-average free space.
    #   Tends to fill drives sequentially and respects branch order. Good for predictability and reducing disk spin-ups.
    # func.getattr=newest: File attributes (like mtime) are taken from the newest (most recently modified) version across branches.
    # cache.readdir=true: Enables directory entry caching, improving readdir() performance when supported.
    # cache.files=partial: Enables partial file data caching in FUSE, boosting read performance.
    #   Helps with streaming or sequential access but requires dropcacheonclose to avoid double caching.
    # dropcacheonclose=true: When a file is closed, instructs the kernel to drop its page cache.
    #   Recommended with cache.files=partial to reduce memory usage and avoid duplication.
    options: "process-thread-count=-2,read-thread-count=-2,lazy-umount-mountpoint=true,category.create=pfrd,func.getattr=newest,cache.readdir=true,cache.files=partial,dropcacheonclose=true"
    branches:
      - "/mnt/hdd1"
      - "/mnt/hdd2"
      - "/mnt/hdd3"
      - "/mnt/hdd4"

