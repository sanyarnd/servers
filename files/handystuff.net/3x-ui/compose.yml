services:
  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui
    container_name: 3x-ui
    restart: unless-stopped
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
    tty: true
    labels:
      com.centurylinklabs.watchtower.enable: true
      traefik.enable: true
      # forward UI
      traefik.http.routers.3x-ui.service: 3x-ui
      traefik.http.services.3x-ui.loadbalancer.server.port: 2053
      # forward VLESS
      traefik.tcp.routers.vless.rule: HostSNI(`www.microsoft.com`)
      traefik.tcp.routers.vless.tls.passthrough: true
      traefik.tcp.routers.vless.service: 3x-ui-vless
      traefik.tcp.services.3x-ui-vless.loadbalancer.server.port: 443
    volumes:
      - ./db/:/etc/x-ui/
      - ./cert/:/root/cert/
    networks:
      - traefik

networks:
  traefik:
    external: true
