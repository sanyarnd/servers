services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1001 # user id
      - PGID=1002 # group id
      - TZ=Europe/Moscow
      - WEBUI_PORT=8111
      - TORRENTING_PORT=6881
    ports:
      - 8111:8111
      - 6881:6881
      - 6881:6881/udp
    volumes:
      - config:/config
      - /mnt/media/torrents:/downloads
volumes:
  config:
