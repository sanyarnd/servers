services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    restart: unless-stopped
    container_name: seerr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Moscow
      - PORT=5055
    ports:
      - "5055:5055"
    volumes:
      - config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

volumes:
  config: