---
# Shared deploy flow for docker-compose app roles.
# Caller must set: app_name, compose_src_path (e.g. "{{ role_path }}/files/compose.yml")
- name: Ensure destination directory exists
  ansible.builtin.file:
    path: "{{ docker_services_dir }}/{{ app_name }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ docker_services_group }}"
    mode: "0775"

- name: Push out the compose file
  ansible.builtin.copy:
    src: "{{ compose_src_path }}"
    dest: "{{ docker_services_dir }}/{{ app_name }}/compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ docker_services_group }}"
    mode: "0664"

- name: Pull images and start services
  community.docker.docker_compose_v2:
    project_src: "{{ docker_services_dir }}/{{ app_name }}"
    state: present
    pull: always
