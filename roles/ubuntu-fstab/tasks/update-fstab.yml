---
- name: Verify that boot drives are defined
  ansible.builtin.fail:
    msg: "You must define all the boot drives manually"
  when: mounts_boot is not defined or mounts_boot|length == 0

- name: Render candidate 'fstab' file
  ansible.builtin.template:
    dest: "{{ mounts_fstab_path }}.ansible"
    src: fstab.j2
    owner: root
    group: root
    mode: "0644"

- name: Validate candidate fstab
  ansible.builtin.command:
    argv:
      - findmnt
      - --verify
      - --verbose
      - --tab-file
      - "{{ mounts_fstab_path }}.ansible"
  register: fstab_verify
  changed_when: false
  failed_when: fstab_verify.rc != 0

- name: Push validated 'fstab' file into place
  ansible.builtin.copy:
    src: "{{ mounts_fstab_path }}.ansible"
    dest: "{{ mounts_fstab_path }}"
    owner: root
    group: root
    mode: "0644"
    remote_src: true

- name: Create mount points for normal drives
  ansible.builtin.file:
    path: "{{ item.mount_point }}"
    state: directory
    owner: "{{ mounts_owner_user }}"
    group: "{{ mounts_access_group }}"
    mode: "0770"
  loop: "{{ mounts_normal }}"
  when: mounts_normal is defined

- name: Create mount points for drive pools
  ansible.builtin.file:
    path: "{{ item.mount_point }}"
    state: directory
    owner: "{{ mounts_owner_user }}"
    group: "{{ mounts_access_group }}"
    mode: "0770"
  loop: "{{ mounts_pooled }}"
  when: mounts_pooled is defined

- name: Reload systemd to pick up changes to fstab
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Mount drives
  ansible.builtin.command: mount -a -t nofuse.mergerfs

- name: Mount pooled drives
  ansible.builtin.command: "mount --target {{ item.mount_point }}"
  loop: "{{ mounts_pooled }}"
  when: mounts_pooled is defined

- name: Ensure ownership of normal drive roots
  ansible.builtin.file:
    path: "{{ item.mount_point }}"
    state: directory
    owner: "{{ mounts_owner_user }}"
    group: "{{ mounts_access_group }}"
    mode: "0770"
  loop: "{{ mounts_normal }}"
  when: mounts_normal is defined

- name: Ensure ownership of pooled drive roots
  ansible.builtin.file:
    path: "{{ item.mount_point }}"
    state: directory
    owner: "{{ mounts_owner_user }}"
    group: "{{ mounts_access_group }}"
    mode: "0770"
  loop: "{{ mounts_pooled }}"
  when: mounts_pooled is defined
