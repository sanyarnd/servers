---
- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker_services_users }}"

- name: Enable Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: yes

- name: Enable Containerd service
  ansible.builtin.systemd:
    name: containerd
    enabled: yes
