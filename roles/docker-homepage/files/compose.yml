services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "5000:3000"
    volumes:
      - config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: start.home,192.168.88.88:5000
      PUID: 1001
      PGID: 1002

volumes:
  config: