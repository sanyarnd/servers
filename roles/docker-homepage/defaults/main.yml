app_name: homepage

# Service catalogue — drives the homepage layout.
# Each group becomes a section; services within get icons + descriptions.
homepage_groups:
  - group: Smart Home
    icon_style: row
    columns: 2
    services:
      - id: hass
        label: Home Assistant
        icon: home-assistant
        description: Home automation & IoT
      - id: z2m
        label: Zigbee2MQTT
        icon: zigbee2mqtt
        description: Zigbee device management

  - group: Media
    icon_style: row
    columns: 3
    services:
      - id: jellyfin
        label: Jellyfin
        icon: jellyfin
        description: Movies, TV & Music
      - id: qbt
        label: qBittorrent
        icon: qbittorrent
        description: Torrent downloads
      - id: stash
        label: Stash
        icon: stash
        description: Media organizer

  - group: Documents & Photos
    icon_style: row
    columns: 2
    services:
      - id: immich
        label: Immich
        icon: immich
        description: Photo & video backup
      - id: paperless
        label: Paperless-ngx
        icon: paperless-ngx
        description: Document management

  - group: Tools
    icon_style: row
    columns: 3
    services:
      - id: pairdrop
        label: PairDrop
        icon: pairdrop
        description: Local file sharing
      - id: dockhand
        label: Dockhand
        icon: docker
        description: Docker container management
      - id: scrutiny
        label: Scrutiny
        icon: scrutiny
        description: Disk S.M.A.R.T. monitoring

  - group: Infrastructure
    icon_style: row
    columns: 2
    services:
      - id: dns
        label: Technitium DNS
        icon: technitium-dns
        description: DNS server & ad blocking
      - id: start
        label: Homepage
        icon: homepage
        description: This dashboard
