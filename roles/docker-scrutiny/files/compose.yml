services:
  scrutiny:
    image: "ghcr.io/analogj/scrutiny:latest-omnibus"
    container_name: "scrutiny"
    restart: unless-stopped
    ports:
      - "8130:8080"
    volumes:
      - /run/udev:/run/udev:ro
      - "config:/opt/scrutiny/config"
      - "influxdb:/opt/scrutiny/influxdb"
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    devices:
      - "/dev/sda"
      - "/dev/sdb"
      - "/dev/sdc"
      - "/dev/sdd"
    environment:
      - TZ=Europe/Moscow

volumes:
  config:
  influxdb: