---
- name: Copy mosquitto config to app directory
  ansible.builtin.copy:
    src: mosquitto.conf
    dest: "{{ docker_services_dir }}/{{ app_name }}/mosquitto.conf"
    mode: '0644'
  notify: restart mosquitto

- name: Copy config to mosquitto container
  community.docker.docker_container_copy_into:
    container: mosquitto
    path: "{{ docker_services_dir }}/{{ app_name }}/mosquitto.conf"
    container_path: /mosquitto/config/mosquitto.conf
